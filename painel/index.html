<script>/* visual do painel: "classico" desliga a folha nova; modo claro/escuro: lc.modo = light | dark | (vazio = segue o sistema).
   data-modo recebe o modo efetivo; tema-painel.css pinta por ele. (Troca em Configurações; fica neste navegador.) */
(function(){try{if(localStorage.getItem("lc.visual")==="classico")document.getElementById("tema-novo").disabled=true}catch(e){}
var mq=matchMedia("(prefers-color-scheme: dark)");function aplicar(){var p="";try{p=localStorage.getItem("lc.modo")||""}catch(e){}
/* padrão = claro; "auto" só quando escolhido em Configurações */
document.documentElement.dataset.modoPref=p||"light";document.documentElement.dataset.modo=p==="dark"?"dark":p==="auto"?(mq.matches?"dark":"light"):"light"}
try{var f=localStorage.getItem("lc.fonte"),e=localStorage.getItem("lc.escala");if(f)document.documentElement.dataset.fonte=f;if(e)document.documentElement.style.fontSize=Math.round(e*100)+"%"}catch(x){}
aplicar();mq.addEventListener("change",aplicar);window.LC_APLICAR_MODO=aplicar})()</script>
